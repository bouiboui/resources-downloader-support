name: Product support
description: Report a Resources Downloader bug without sharing private data
title: "[Support] "
labels:
  - support
body:
  - type: markdown
    attributes:
      value: |
        Never post license keys, order details, private URLs, filenames, downloaded content, or personal data here.
  - type: dropdown
    id: action
    attributes:
      label: Affected action
      options:
        - Current-page scan
        - Reload & rescan
        - Auto-scroll
        - Multiple pages
        - Reliable download
        - Normal ZIP
        - Clean ZIP
        - License activation
        - Other
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Extension and browser version
      placeholder: Resources Downloader 0.1.0; Chrome 140
    validations:
      required: true
  - type: textarea
    id: result
    attributes:
      label: What happened?
      description: Describe the visible result and exact error without identifying the page or files.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Safe reproduction steps
      description: Use a public or synthetic page if a URL is necessary.
    validations:
      required: true
